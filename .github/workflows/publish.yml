name: Publish crates.io

# crates.io release line for the ayane crate family (proto, mail, store,
# engine, smtpd and the umbrella ayane crate).
#
# Tag namespace: `v<version>`, same shape himari uses. The `<version>` in the
# tag must equal the workspace version. workflow_dispatch re-runs on master
# publish exactly what master declares, which is how a half-finished wave is
# resumed (the per-crate skip guard below makes re-runs idempotent).
on:
  push:
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: Verify the requested version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve the requested version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(awk '/^\[workspace\.package\]/ { in_ws = 1; next } /^\[/ { in_ws = 0 } in_ws && /^version[[:space:]]*=/ { sub(/^version[[:space:]]*=[[:space:]]*"/, ""); sub(/".*$/, ""); print; exit }' Cargo.toml)" >> "$GITHUB_OUTPUT"
          fi
      - name: Ensure the release tag is on master
        if: github.event_name == 'push'
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME is not an ancestor of master — tag the squash-merged master commit, not the PR branch"
            exit 1
          fi
      - name: Compare with the workspace version
        run: |
          WANT="${{ steps.version.outputs.version }}"
          HAVE=$(awk '/^\[workspace\.package\]/ { in_ws = 1; next } /^\[/ { in_ws = 0 } in_ws && /^version[[:space:]]*=/ { sub(/^version[[:space:]]*=[[:space:]]*"/, ""); sub(/".*$/, ""); print; exit }' Cargo.toml)
          if [ -z "$HAVE" ]; then
            echo "::error::could not read the [workspace.package] version"
            exit 1
          fi
          if [ "$HAVE" != "$WANT" ]; then
            echo "::error::workspace version ($HAVE) != requested version ($WANT)"
            exit 1
          fi
          echo "Publishing the ayane crate family $WANT"

  publish:
    name: Publish the crates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [verify-version]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Cargo.lock is committed in this repo, so `--locked` pins every publish
      # to exactly the graph master resolved.
      - name: Publish every crate that still has to ship
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: |
          set -euo pipefail
          version_of() {
            python3 - "$1" <<'PY'
          import json, subprocess, sys
          meta = json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"]))
          print(next(p["version"] for p in meta["packages"] if p["name"] == sys.argv[1]))
          PY
          }
          # crates.io rejects curl's default user agent (403), and a 403/000
          # must never be mistaken for "absent" — that would re-publish a
          # version that already exists.
          state() {
            local code
            code=$(curl -s -A "celestia-island-release (ayane publish workflow)" \
              -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/$1/$2" || echo 000)
            case "$code" in
              200) echo published ;;
              404) echo absent ;;
              *) echo "error-$code" ;;
            esac
          }
          publish() {
            local crate="$1" version
            version=$(version_of "$crate")
            case "$(state "$crate" "$version")" in
              published)
                echo "::warning::$crate $version is already on crates.io — skipping"
                return 0
                ;;
              absent) ;;
              *)
                echo "::error::cannot determine whether $crate $version is published: $(state "$crate" "$version")"
                return 1
                ;;
            esac
            cargo publish -p "$crate" --locked
            for _ in $(seq 1 30); do
              [ "$(state "$crate" "$version")" = "published" ] && return 0
              sleep 10
            done
            echo "::error::$crate $version did not appear on crates.io after publishing"
            return 1
          }
          # Dependency order: the umbrella depends on all five, smtpd depends on
          # mail + store, and each library depends on proto. Publishing the chain
          # bottom-up lets each successor resolve its predecessor from the index.
          publish ayane-proto
          publish ayane-mail
          publish ayane-store
          publish ayane-engine
          publish ayane-smtpd
          publish ayane
