[advisories]
db-path = "~/.cargo/advisory-db"
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
ignore = [
    # RUSTSEC-2026-0543 (chrono unmaintained, issued 2026-11-17): kirino's
    # auth contract names chrono in its public types (LoginAttempt,
    # LinkedAccount carry chrono::DateTime<Utc>), so a direct chrono
    # declaration is what lets this tree name those fields; the stored link
    # row follows the contract's type. No patched chrono release exists.
    # Remove this ignore when kirino moves to jiff and the last direct
    # chrono declaration here is gone. EXPIRY: 2027-01-31.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained (no patched release exists); it stays a direct dependency only because kirino's auth contract carries chrono::DateTime in its public types. Expiry 2027-01-31." },
    # RUSTSEC-2023-0071 (rsa, Marvin Attack; no upstream patch exists) and
    # RUSTSEC-2026-0387 (crypto-bigint constant-time ops): both arrive only
    # through kirino's auth-oauth feature → jsonwebtoken 11's rust_crypto
    # backend (rsa, p256 → crypto-bigint 0.5.5). ayane reads the identity
    # from each provider's userinfo endpoint and hands `finish` NO ID-token
    # keys, so neither the RSA decrypt/unpadding path nor the ECDSA scalar
    # arithmetic these advisories apply to ever runs here. Same chain and
    # disposition as kirino's own deny.toml. RE-REVIEW: 2026-12-01.
    { id = "RUSTSEC-2023-0071", reason = "no patched rsa release; transitive-only via kirino auth-oauth, and ayane verifies no ID tokens. RE-REVIEW: 2026-12-01." },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 via jsonwebtoken's rust_crypto backend; ayane verifies no ID tokens, so the affected ECDSA arithmetic never runs. RE-REVIEW: 2026-12-01." },
]

[licenses]
# Permissive only. AGPL, GPL and LGPL are deliberately absent: ayane must never
# absorb a copyleft runtime dependency. The mail daemons are separate processes
# and out of scope for this gate.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "CC0-1.0",
    # webpki-roots (reqwest rustls-tls root store) — permissive data
    # license, already allowed across the family (arona/chest/0721).
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    "LicenseRef-SySL-1.0",
]
confidence-threshold = 0.8
# Workspace crates carry SySL 1.0, which is not an SPDX expression.
private = { ignore = true }

# The family's own crates (ayane*, lacrymira*) carry the SySL 1.0 text via
# license-file; the file hash pins it so a swapped license would fail loudly.
[[licenses.clarify]]
name = "ayane"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "ayane-proto"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "ayane-smtpd"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "ayane-mail"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "ayane-engine"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "ayane-store"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "lacrymira"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "lacrymira-macros"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "lacrymira-redb"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

# The auth contract and its OAuth relying-party core (kirino). Same SySL 1.0
# text as the workspace crates; the hash pins the file kirino 0.9.6 ships.
[[licenses.clarify]]
name = "kirino"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x629cea03 }]

[[licenses.clarify]]
name = "kirino-macro"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x629cea03 }]

# The family error landing (plana, git master): the same SySL 1.0 text as the
# rows above, read from the workspace root it shares (hash = plana's own
# LICENSE at 0.8.1, the file the sibling repos pin for the same purpose).
[[licenses.clarify]]
name = "plana-error-landing"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "../../LICENSE", hash = 0xda2b7c13 }]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# kirino rides yuuka 0.6 and sha2 0.11 beside lacrymira's yuuka 0.11 line and
# the workspace's sha2 0.10: duplicate versions are surfaced, not refused.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# plana's error landing is not published on crates.io, so it rides the plana
# master branch (same allow-list entry as the sibling repos).
allow-git = [
    "https://github.com/celestia-island/plana",
]