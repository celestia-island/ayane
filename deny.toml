[advisories]
db-path = "~/.cargo/advisory-db"
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"

[licenses]
# Permissive only. AGPL, GPL and LGPL are deliberately absent: ayane must never
# absorb a copyleft runtime dependency. The mail daemons are separate processes
# and out of scope for this gate.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "CC0-1.0",
    # webpki-roots (reqwest rustls-tls root store) — permissive data
    # license, already allowed across the family (arona/chest/0721).
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    "LicenseRef-SySL-1.0",
]
confidence-threshold = 0.8
# Workspace crates carry SySL 1.0, which is not an SPDX expression.
private = { ignore = true }

# The family's own crates (ayane*, lacrymira*) carry the SySL 1.0 text via
# license-file; the file hash pins it so a swapped license would fail loudly.
[[licenses.clarify]]
name = "ayane"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "ayane-proto"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "ayane-mail"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "ayane-engine"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "ayane-store"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "lacrymira"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "lacrymira-macros"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "lacrymira-redb"
expression = "LicenseRef-SySL-1.0"
license-files = [{ path = "LICENSE", hash = 0x4313eae3 }]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]