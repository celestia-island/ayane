[package]
name = "ayane-mail"
description = "Pure routing and recipient policy for the ayane mail service, plus the MIME reading and building the webmail needs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
readme = "../../README.md"

[dependencies]
ayane-proto = { workspace = true }
pulldown-cmark = { workspace = true }
# `lettre` is a *builder* here: it renders the MIME a message needs and never
# opens a transport (the SMTP side is the engine's own outbound path).
lettre = { workspace = true }
serde = { workspace = true }
mail-parser = { workspace = true }
ammonia = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }

[lints]
workspace = true