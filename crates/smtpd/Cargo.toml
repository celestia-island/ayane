[package]
name = "ayane-smtpd"
description = "Inbound SMTP server for the ayane mail service: the RFC 5321 session state machine (PIPELINING/SIZE/CHUNKING/SMTPUTF8), the tokio driver that bounds it, and the crash-safe file spool (a message is acknowledged only after the data and the directory entry are durable)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license-file.workspace = true
publish = true
readme = "../../README.md"

[dependencies]
ayane-mail = { workspace = true }
ayane-store = { workspace = true }
ayane-proto = { workspace = true }
base64 = { workspace = true }
mail-auth = { workspace = true }
memchr = { workspace = true }
# IMAP command/response codec (the IMAP4rev1 grammar). 1.0 is the release
# line the workspace's registry cache already holds; it is not published as
# `^1` from the older names, so the major is pinned where it resolved.
imap-codec = { version = "^1", features = ["starttls"] }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# The binary installs a subscriber; the library only emits events.
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
rustls = { version = "^0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "^0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "^2"
# The outbound client verifies a receiver's certificate against the web's
# roots; the workspace already trusts the same store through reqwest's
# rustls-tls and mail-auth's `webpki-roots` feature.
webpki-roots = "^1"
# The content scanner is an HTTP peer: one `POST /scan` per inbound message
# against the workspace's reqwest (rustls-tls, no new version). The `stream`
# feature is what lets the staged message file be forwarded as the request
# body without ever being buffered whole.
reqwest = { workspace = true, features = ["stream"] }

[dev-dependencies]
tokio = { workspace = true }
uuid = { workspace = true }

[[bin]]
name = "ayane-smtpd"
path = "src/bin/ayane-smtpd.rs"

[lints]
workspace = true

[[test]]
# The `imaplib` end-to-end driver needs a `{SHA512-CRYPT}` hash for the passwd
# file the split-process listener reads; this test writes one from the same
# `sha-crypt` crate the store hashes and verifies with.
name = "imap_hashgen"
path = "tests/imap_hashgen.rs"
harness = false
