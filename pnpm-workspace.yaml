packages:
  - packages/webui

# @parcel/watcher ships prebuilds; its postinstall only verifies them —
# approved here once instead of failing every install.
allowBuilds:
  "@parcel/watcher": true

# The family minimumReleaseAge policy auto-registered these fresh
# publishes; keep them pinned to the audited versions.
minimumReleaseAgeExclude:
  - '@celestia-island/hikari@0.55.458 || 0.55.460 || 0.55.461 || 0.55.462 || 0.55.464 || 0.55.465 || 0.55.467 || 0.55.469 || 0.55.471 || 0.55.472 || 0.55.474 || 0.55.494 || 0.55.498'
  - "@celestia-island/tairitsu-host-client@0.1.0"
