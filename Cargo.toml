[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/engine",
    "crates/smtpd",
    "crates/mail",
    "crates/proto",
    "crates/store",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
authors = ["Celestia Island"]
repository = "https://github.com/celestia-island/ayane"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
# internal
ayane-proto = { path = "crates/proto", version = "^0.1" }
ayane-engine = { path = "crates/engine", version = "^0.1" }
ayane-mail = { path = "crates/mail", version = "^0.1" }
ayane-store = { path = "crates/store", version = "^0.1" }
ayane-smtpd = { path = "crates/smtpd", version = "^0.1" }

# serialization (msgpack on the wire to the store — family line format)
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
rmp-serde = "^1"

# async / http
tokio = { version = "^1", features = ["macros", "net", "rt-multi-thread", "signal", "process", "fs"] }
# The staged-message reader rspamd.rs streams with (the `io` half reqwest's
# `stream` feature already resolves); declared here so smtpd can name it.
tokio-util = { version = "^0.7", default-features = false, features = ["io"] }
axum = { version = "^0.8", features = ["ws"] }
tower = { version = "^0.5", features = ["util"] }
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }

# mail: client side only — the MTA stays Postfix, so nothing here listens on 25.
lettre = { version = "^0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1"] }
# message parsing + safe html + hashing + dns
# trust verification (SPF / DKIM / ARC / DMARC) — the second consumer of
# hickory-resolver, pinned to the same 0.26 line the workspace already resolves.
mail-auth = { version = "^0.16", default-features = false, features = ["dns-hickory", "webpki-roots", "rust-crypto", "arc"] }
mail-parser = "^1"
ammonia = "^4"
hickory-resolver = { version = "^0.26", features = ["tokio", "system-config"] }
sha2 = "^0.10"
# byte scanning: one memchr pass per bound the driver applies to a message
memchr = "^2"
rust-embed = { version = "^8", features = ["interpolate-folder-path"] }
base64 = "^0.22"
reqwest = { version = "^0.12", default-features = false, features = ["json", "rustls-tls"] }
x509-parser = "^0.17"
pulldown-cmark = { version = "^0.13", default-features = false, features = ["html"] }

# test-only support
regex = "^1"

# storage
lacrymira = "^0.1"
lacrymira-redb = "^0.1"

# passwords (Dovecot {SHA512-CRYPT})
sha-crypt = "^0.6"
getrandom = "^0.3"

# auth: the family's login-mode contract and the OAuth relying-party core
# (protocol only — it opens no socket; the transport is implemented in this
# workspace). `auth-oauth` is the feature that compiles `passport::oauth`.
kirino = { version = "^0.9", default-features = false, features = ["auth-oauth"] }
chrono = { version = "^0.4", features = ["serde"] }
url = "^2"
async-trait = "^0.1"
anyhow = "^1"

# error landing: the family's server half — turn a failed browser
# navigation into the service's own SPA document carrying the
# hk-server-error island, instead of a tab of raw JSON. On crates.io since
# plana put it on the release line; a git edge cannot be published, so the
# registry edge is what lets this workspace's crates go out at all.
plana-error-landing = "^0.8"

# a lock-free single-writer slot: the listener's configuration is swapped
# under running connections (a reload is one store, a connection is one load)
arc-swap = "^1"
# PEM / TLS for the submission listeners the control plane now binds itself
rustls = { version = "^0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "^0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "^2"

# constant-time comparison for the one credential this crate checks itself
# (a shared mailbox's machine password, which has no hash to verify against)
subtle = "^2"

# misc
thiserror = "^2"
uuid = { version = "^1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"