[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/engine",
    "crates/smtpd",
    "crates/mail",
    "crates/proto",
    "crates/store",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
authors = ["Celestia Island"]
repository = "https://github.com/celestia-island/ayane"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
# internal
ayane-proto = { path = "crates/proto", version = "^0.1" }
ayane-engine = { path = "crates/engine", version = "^0.1" }
ayane-mail = { path = "crates/mail", version = "^0.1" }
ayane-store = { path = "crates/store", version = "^0.1" }

# serialization (msgpack on the wire to the store — family line format)
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
rmp-serde = "^1"

# async / http
tokio = { version = "^1", features = ["macros", "net", "rt-multi-thread", "signal", "process", "fs"] }
axum = { version = "^0.8", features = ["ws"] }
tower = { version = "^0.5", features = ["util"] }
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }
futures-util = { version = "^0.3", default-features = false }

# mail: client side only — the MTA stays Postfix, so nothing here listens on 25.
lettre = { version = "^0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1"] }
# message parsing + safe html + hashing + dns
# trust verification (SPF / DKIM / ARC / DMARC) — the second consumer of
# hickory-resolver, pinned to the same 0.26 line the workspace already resolves.
mail-auth = { version = "^0.16", default-features = false, features = ["dns-hickory", "webpki-roots", "rust-crypto", "arc"] }
mail-parser = "^1"
ammonia = "^4"
hickory-resolver = { version = "^0.26", features = ["tokio", "system-config"] }
sha2 = "^0.10"
rust-embed = { version = "^8", features = ["interpolate-folder-path"] }
base64 = "^0.22"
reqwest = { version = "^0.12", default-features = false, features = ["json", "rustls-tls"] }
x509-parser = "^0.17"
async-imap = { version = "^0.12", default-features = false, features = ["runtime-tokio"] }
pulldown-cmark = { version = "^0.13", default-features = false, features = ["html"] }

# test-only support
regex = "^1"

# storage
lacrymira = "^0.1"
lacrymira-redb = "^0.1"

# passwords (Dovecot {SHA512-CRYPT})
sha-crypt = "^0.6"
getrandom = "^0.3"

# auth: the family's login-mode contract and the OAuth relying-party core
# (protocol only — it opens no socket; the transport is implemented in this
# workspace). `auth-oauth` is the feature that compiles `passport::oauth`.
kirino = { version = "^0.9", default-features = false, features = ["auth-oauth"] }
chrono = { version = "^0.4", features = ["serde"] }
url = "^2"
async-trait = "^0.1"
anyhow = "^1"

# error landing: the family's server half — turn a failed browser
# navigation into the service's own SPA document carrying the
# hk-server-error island, instead of a tab of raw JSON. Not published on
# crates.io yet, so it rides plana's master branch.
plana-error-landing = { git = "https://github.com/celestia-island/plana", branch = "master", version = "^0.8" }

# misc
thiserror = "^2"
uuid = { version = "^1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"