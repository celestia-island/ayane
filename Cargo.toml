[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/engine",
    "crates/mail",
    "crates/proto",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
authors = ["Celestia Island"]
repository = "https://github.com/celestia-island/ayane"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
# internal
ayane-proto = { path = "crates/proto", version = "^0.1" }

# serialization
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"

# async / http
tokio = { version = "^1", features = ["macros", "net", "rt-multi-thread", "signal"] }
axum = "^0.8"
tower = { version = "^0.5", features = ["util"] }
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }

# mail: client side only — the MTA stays Postfix, so nothing here listens on 25.
lettre = { version = "^0.11", default-features = false, features = ["builder"] }

# misc
thiserror = "^2"
uuid = { version = "^1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"