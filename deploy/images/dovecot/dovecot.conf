# ayane dev Dovecot — one self-contained file (no conf.d includes).
#
# Accounts live in /etc/dovecot/passwd (rendered by the control plane,
# mounted read-only); it serves both passdb and userdb, so a single source
# of truth answers "can this user log in" and "where is their mail".

listen = *
protocols = imap lmtp

# Foreground logging to stderr so `docker logs` shows auth failures.
log_path = /dev/stderr
info_log_path = /dev/stderr

# Dev rig only: plaintext AUTH inside the compose network. A real edge
# terminates TLS in front of this listener.
disable_plaintext_auth = no
ssl = no
auth_mechanisms = plain login

# Keep the full address as the username (passwd lines are keyed user@domain).
auth_username_format = %Lu

mail_location = maildir:~/Maildir
first_valid_uid = 5000

postmaster_address = postmaster@ayane.invalid

passdb {
  driver = passwd-file
  args = scheme=CRYPT username_format=%u /etc/dovecot/passwd
}
userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/passwd
}

# SASL endpoint consumed by Postfix.
service auth {
  inet_listener auth-for-postfix {
    port = 12345
  }
}

# LMTP endpoint Postfix delivers virtual mail into.
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

protocol lmtp {
  postmaster_address = postmaster@ayane.invalid
}