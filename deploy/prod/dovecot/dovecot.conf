# ayane production Dovecot — IMAPS (993) with real certificates, LMTP and
# SASL for Postfix, one self-contained file (no conf.d includes).
#
# SECURITY BOUNDARY: `disable_plaintext_auth = no` is only acceptable because
# port 143 is bound to the HOST LOOPBACK in the prod compose (on-host smoke
# tests); every internet-facing client must use 993 (imaps).

listen = *
protocols = imap lmtp

log_path = /dev/stderr
info_log_path = /dev/stderr

ssl = yes
ssl_cert = </etc/letsencrypt/live/mail.acgsyzx.me/fullchain.pem
ssl_key = </etc/letsencrypt/live/mail.acgsyzx.me/privkey.pem
ssl_min_protocol = TLSv1.2
disable_plaintext_auth = no
auth_mechanisms = plain login

auth_username_format = %Lu

mail_location = maildir:~/Maildir
first_valid_uid = 5000

postmaster_address = postmaster@acgsyzx.me

passdb {
  driver = passwd-file
  args = scheme=CRYPT username_format=%u /etc/dovecot/passwd
}
userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/passwd
}

# SASL endpoint consumed by Postfix.
service auth {
  inet_listener auth-for-postfix {
    port = 12345
  }
}

# LMTP endpoint Postfix delivers virtual mail into.
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

protocol lmtp {
  postmaster_address = postmaster@acgsyzx.me
}