# DKIM signing: every outbound message from a local domain is signed with the
# per-domain selector below. Keys are generated on the rig host:
#   docker compose -f deploy/prod/docker-compose.yml exec rspamd \
#     rspamadm dkim_keygen -d acgsyzx.me -s ayane -b 2048 \
#     -k /var/lib/rspamd/dkim/acgsyzx.me/ayane.private
# and the public half is published as ayane._domainkey TXT in Cloudflare.
try_fallback = false;
use_esld = false;

domain {
  acgsyzx.me {
    selectors = [
      {
        selector = "ayane";
        path = "/var/lib/rspamd/dkim/acgsyzx.me/ayane.private";
      }
    ];
  }
}